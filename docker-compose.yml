services:
  mongo:
    image: mongo:8
    container_name: haircare-mongo
    restart: unless-stopped
    # Prisma needs a replica set (it uses transactions), even for a single node.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set the first time, then just reports health.
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
